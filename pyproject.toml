[project]
name = "hiddenlayer-strands"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashton Sidhu", email = "ashton.sidhu1994@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "hiddenlayer-sdk>=3.1.0",
    "strands-agents>=1.15.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
    "strands-agents-tools>=0.2.14",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["hiddenlayer_strands"]
combine-as-imports = true
