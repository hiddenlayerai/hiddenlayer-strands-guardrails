[project]
name = "hiddenlayer-strands"
version = "0.0.1"
description = "Official Hiddenlayer AWS Strands integration."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "HiddenLayer", email = "sdks@hiddenlayer.com" },
]
dependencies = [
    "hiddenlayer-sdk>=3.1.0",
    "strands-agents>=1.15.0",
]
requires-python = ">= 3.10"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "https://github.com/hiddenlayerai/hiddenlayer-strands"
Repository = "https://github.com/hiddenlayerai/hiddenlayer-strands"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.4",
    "strands-agents-tools>=0.2.14",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["hiddenlayer_strands"]
combine-as-imports = true
